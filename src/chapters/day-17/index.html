<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>오늘의 행운 운세 🔮</title>
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: Arial;
        color: white;
        text-align: center;
        padding: 20px;
        min-height: 100vh;
      }
      .fortune-card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px;
        margin: 30px auto;
        max-width: 500px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.5s;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fortune-number {
        font-size: 3em;
        margin: 20px 0;
      }
      .fortune-text {
        font-size: 1.5em;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <h1>🔮 무한 행운 운세 🔮</h1>
    <p>스크롤하면 운세가 계속 나와요!</p>

    <div id="fortunes"></div>

    <script>
      function* fortuneGenerator() {
        const fortunes = [
          { icon: "🍀", text: "오늘은 특별한 행운이 찾아올 거예요!" },
          { icon: "✨", text: "새로운 기회를 놓치지 마세요!" },
          { icon: "💰", text: "금전운이 상승하는 날입니다!" },
          { icon: "❤️", text: "소중한 사람과 좋은 시간 보내세요!" },
          { icon: "🌟", text: "당신의 재능이 빛을 발할 거예요!" },
          { icon: "🎯", text: "목표를 향해 한 걸음 나아가세요!" },
          { icon: "🌈", text: "비 온 뒤 땅이 굳듯 좋은 일이!" },
          { icon: "🎁", text: "예상치 못한 선물을 받을 수 있어요!" },
          { icon: "🚀", text: "도전하기 좋은 날입니다!" },
          { icon: "🌸", text: "주변 사람들에게 행복을 전하세요!" },
        ];

        let num = 1;
        while (true) {
          const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
          yield { num: num++, ...fortune };
        }
      }

      let loader = fortuneGenerator();
      let isLoading = false;

      function atBottom() {
        return window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100;
      }

      function renderFortune(fortune) {
        const div = document.createElement("div");
        div.className = "fortune-card";
        div.innerHTML = `
        <div class="fortune-number">${fortune.icon}</div>
        <h2>운세 #${fortune.num}</h2>
        <p class="fortune-text">${fortune.text}</p>
      `;
        document.getElementById("fortunes").appendChild(div);
      }

      function loadMore() {
        if (isLoading) return;
        isLoading = true;

        // 즉시 렌더링 (setTimeout 제거)
        const fortune = loader.next().value;
        renderFortune(fortune);

        setTimeout(() => {
          isLoading = false;
        }, 100);
      }

      window.addEventListener("scroll", () => {
        if (atBottom()) loadMore();
      });

      // ✅ 초기 5개 로드 (동기적으로)
      for (let i = 0; i < 5; i++) {
        const fortune = loader.next().value;
        renderFortune(fortune);
      }
    </script>
  </body>
</html>
