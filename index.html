<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript 학습 대시보드</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: #F9FAFB;
      min-height: 100vh;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      /* background: linear-gradient(135deg, #3182F6 0%, #6366F1 100%); */
      padding: 60px 24px 48px;
      margin: 0 0 48px 0;
      border-radius: 0 0 32px 32px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }

    .subtitle {
      font-size: 1.125rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    .subtitle a {
      color: inherit;
      text-decoration: none;
    }

    .progress-bar {
      background: rgba(255, 255, 255, 0.2);
      height: 12px;
      border-radius: 100px;
      overflow: hidden;
      margin: 32px 0 24px;
    }

    .progress-fill {
      background: #FFFFFF;
      height: 100%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 0;
    }

    .stat-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .stat-number {
      font-size: 2.25rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.9375rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .weeks {
      display: grid;
      gap: 24px;
      padding: 0 24px 60px;
    }

    .week-section {
      background: white;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid #E5E8EB;
    }

    .week-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #191F28;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }

    .day-card {
      background: #F9FAFB;
      color: #191F28;
      padding: 20px;
      border-radius: 12px;
      border: 1.5px solid #E5E8EB;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-align: left;
      width: 100%;
    }

    .day-card:hover {
      background: #F2F4F6;
      border-color: #3182F6;
      transform: translateY(-2px);
    }

    .day-card:active {
      transform: translateY(0);
    }

    .day-card.completed {
      background: #EBF4FF;
      border-color: #3182F6;
    }

    .day-card.completed .day-number {
      color: #3182F6;
    }

    .day-number {
      font-size: 0.8125rem;
      font-weight: 700;
      color: #8B95A1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .day-title {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #191F28;
      letter-spacing: -0.01em;
    }

    .day-topics {
      font-size: 0.875rem;
      color: #6B7684;
      line-height: 1.5;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      header {
        padding: 40px 16px 32px;
        border-radius: 0 0 24px 24px;
      }

      h1 {
        font-size: 2rem;
      }

      .days-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        flex-direction: column;
      }

      .week-section {
        padding: 24px 20px;
      }

      .weeks {
        padding: 0 16px 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 JavaScript 학습 여정</h1>
      <p class="subtitle"><a href="https://ko.javascript.info/" target="_blank">ko.javascript.info</a> 49일 완주 챌린지</p>
      
      <div class="progress-bar">

        <div class="stat-card">
          <div class="stat-number" id="totalDays">49</div>
          <div class="stat-label">전체 일수</div>
        </div>

    </header>

    <div class="weeks">
      <!-- Week 1: 자바스크립트 기본 -->
      <section class="week-section">
        <h2 class="week-title">Week 1: 자바스크립트 기본</h2>
        <div class="days-grid">
          <button class="day-card" onclick="openDay(1)">

          </button>
          <button class="day-card" onclick="openDay(3)">

            <div class="day-topics">alert/prompt/confirm, 형 변환</div>
          </button>
          <button class="day-card" onclick="openDay(4)">

          <button class="day-card" onclick="openDay(5)">

          </button>
          <button class="day-card" onclick="openDay(10)">

          <button class="day-card" onclick="openDay(11)">

          <button class="day-card" onclick="openDay(33)">

  <script type="module" src="/src/main.js"></script>
  <script>
    function loadProgress() {
      const currentDay = parseInt(localStorage.getItem('js-current-day') || '0');
      const total = 49;
      const percentage = currentDay > 0 ? Math.round((currentDay / total) * 100) : 0;
      
      document.getElementById('progressBar').style.width = percentage + '%';
      document.getElementById('completedDays').textContent = currentDay;
      
      document.querySelectorAll('.day-card').forEach(card => {
        const dayText = card.querySelector('.day-number').textContent;
        const dayNum = parseInt(dayText.replace('Day ', ''));
        
        if (dayNum <= currentDay) {
          card.classList.add('completed');
        } else {
          card.classList.remove('completed');
        }
      });
      
      console.log(`📈 진행률: ${currentDay}/${total} (${percentage}%)`);
    }

    function openDay(dayNum) {
      const dayStr = dayNum.toString().padStart(2, '0');
      alert(`Day ${dayNum}를 학습하려면:\n\n1. src/main.js 열기\n2. import './chapters/day-${dayStr}/index.js' 활성화\n3. 저장 후 Console 확인!`);
    }

    loadProgress();
  </script>
</body>
